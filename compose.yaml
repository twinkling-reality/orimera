# A local composition, target agnostic on purpose. Nothing here names a cloud, a region, a domain
# or an account: every such value is an environment variable with a stated fill-in, because the
# deployment target is a human decision that has not been made.
#
# `docs/deployment.md` is the document this file implements. Read it before changing anything
# here, in particular section 6 on the two health signals and the wording rules in invariant 10.

name: orimera

services:
  postgres:
    # The documented target, matched exactly: PostgreSQL 18 with pgvector 0.8.6, which is what
    # `tests/pg_harness.py` refuses to run without. A different tag here means the suite is
    # verifying a schema the deployment does not run.
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_DB: orimera
      POSTGRES_USER: orimera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD; there is no default}
    volumes:
      # PostgreSQL 18 moved PGDATA and the image's VOLUME with it. Mounting the old
      # /var/lib/postgresql/data would give a volume the server does not write to, and the
      # symptom is a database that is empty after every restart.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orimera -d orimera"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs once, to completion, before the API starts. Migrations and role grants are one command
  # because there is one correct order; see orimera/db/cli.py.
  migrate:
    build: .
    command: ["orimera-db"]
    environment:
      ORIMERA_DATABASE_URL: postgresql://orimera:${POSTGRES_PASSWORD}@postgres:5432/orimera
      ORIMERA_APP_ROLE_PASSWORD: ${ORIMERA_APP_ROLE_PASSWORD:?set ORIMERA_APP_ROLE_PASSWORD; the runtime must not use the owner}
      ORIMERA_EXECUTOR_ROLE_PASSWORD: ${ORIMERA_EXECUTOR_ROLE_PASSWORD:?set ORIMERA_EXECUTOR_ROLE_PASSWORD; the executor has its own read-only role}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      # Runtime processes never receive the bootstrap owner credential. PostgreSQL superusers
      # bypass row-level security even on FORCE tables, so this role choice is a data boundary.
      ORIMERA_DATABASE_URL: postgresql://orimera_app:${ORIMERA_APP_ROLE_PASSWORD}@postgres:5432/orimera
      ORIMERA_READONLY_DATABASE_URL: postgresql://orimera_ro:${ORIMERA_EXECUTOR_ROLE_PASSWORD}@postgres:5432/orimera
      # No default. `load_token_directory` raises when it is unset, and an API that started with
      # an empty token directory would accept nobody while looking healthy.
      ORIMERA_API_TOKENS: ${ORIMERA_API_TOKENS:?set ORIMERA_API_TOKENS; there is no default}
      ORIMERA_DATA_DIR: /var/lib/orimera
      # Production delivery belongs to the separate worker service below. The in-process worker
      # remains available for a one-process development run, but this composition does not use it.
      ORIMERA_DERIVATIVE_WORKER: "off"
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
    volumes:
      - media:/var/lib/orimera
    ports:
      - "${ORIMERA_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  derivative-worker:
    build:
      context: .
      args:
        ORIMERA_SYNC_EXTRAS: "--extra reconstruction"
    command: ["orimera-derivative-worker"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 3s
      retries: 3
    environment:
      ORIMERA_DATABASE_URL: postgresql://orimera_app:${ORIMERA_APP_ROLE_PASSWORD}@postgres:5432/orimera
      ORIMERA_WORKSPACE_IDS: ${ORIMERA_WORKSPACE_IDS:?set ORIMERA_WORKSPACE_IDS to the comma-separated workspaces this worker may drain}
      ORIMERA_DATA_DIR: /var/lib/orimera
      ORIMERA_DEPTH_MODEL: moge
      ORIMERA_DEPTH_MODEL_ID: ${ORIMERA_DEPTH_MODEL_ID:-Ruicheng/moge-2-vitl}
      ORIMERA_DEPTH_MODEL_REVISION: ${ORIMERA_DEPTH_MODEL_REVISION:-39c4d5e957afe587e04eec59dc2bcc3be5ecd968}
      ORIMERA_DEPTH_DEVICE: ${ORIMERA_DEPTH_DEVICE:-}
      HF_HOME: /var/lib/orimera/model-cache
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
    volumes:
      - media:/var/lib/orimera
    depends_on:
      migrate:
        condition: service_completed_successfully

  scene-worker:
    build: .
    command: ["orimera-scene-worker"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 3s
      retries: 3
    environment:
      ORIMERA_DATABASE_URL: postgresql://orimera_app:${ORIMERA_APP_ROLE_PASSWORD}@postgres:5432/orimera
      ORIMERA_WORKSPACE_IDS: ${ORIMERA_WORKSPACE_IDS:?set ORIMERA_WORKSPACE_IDS to the comma-separated workspaces this worker may drain}
      ORIMERA_DATA_DIR: /var/lib/orimera
      # Both values enter the signed-by-content pose manifest. No mutable image tag or guessed
      # checkout is accepted as provenance for geometry that reaches the renderer.
      ORIMERA_CODE_REVISION: ${ORIMERA_CODE_REVISION:?set the exact 40-character Git revision}
      ORIMERA_POSE_RUNTIME_IMAGE: ${ORIMERA_POSE_RUNTIME_IMAGE:?set an image reference pinned by sha256 digest}
    volumes:
      - media:/var/lib/orimera
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  # The content-addressed store. Append-only by policy: nothing in the runtime deletes from it,
  # and erasure runs through a separately authorised purger. Not immutable, not WORM, not
  # tamper-proof: a docker volume supports none of those and claiming them would be an overclaim.
  media:
