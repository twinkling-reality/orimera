[project]
name = "orimera"
version = "0.1.0"
description = "Orimera: a personal world memory model with an evidence-addressed spine."
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }

# Deliberately minimal. Each entry is justified:
#   pydantic  - boundary schemas (HTTP request/response, model json_schema strict payloads).
#               NOT used for the evidence spine types in orimera.evidence: those are frozen
#               dataclasses with explicit validation, because coercion is a hazard for values
#               that feed a hash (see orimera/canonical.py).
#   pillow    - JPEG/PNG decode, EXIF, and the orientation transform at ingest. Orientation is
#               eight values including four mirrored ones, and ImageOps.exif_transpose is the
#               reference implementation of that table; a hand-rolled version would be a
#               subtle wrong-axis bug in a photograph corpus.
#   httpx     - the Token Factory HTTP client. Chosen over the openai SDK because the only
#               thing needed is one POST, and over urllib because MockTransport lets the
#               retry, failover and truncation paths be tested without a network or a
#               credential.
#   fastapi   - the HTTP surface. Chosen over Starlette alone because every request and
#               response body in this API is already a Pydantic model and the integration is
#               the entire value; chosen over Django and Flask because the application needs
#               routing, validation and an OpenAPI document and nothing else, and an ORM here
#               would be a second way to reach the schema that the spine's triggers guard.
#               uvicorn is the server and is a dev-group dependency, because a deployment may
#               prefer a different ASGI server and the library must not force one.
#   psycopg   - PostgreSQL 18 is the only data layer. It was optional while a portable SQLite
#               mirror carried the ingest path; the mirror is deleted, so nothing in this
#               package runs without a database and pretending otherwise would just move the
#               failure to a later import.
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "pillow>=12.3.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
]

# Reconstruction, and why it is optional rather than a dependency.
#
# MoGe-2 is MIT and is the selected monocular depth model, but installing it means torch and a
# 1.3 GB checkpoint, and MoGe 3.0.0 declares `torchvision>=0.19` for which no wheel matching macOS
# arm64 exists at the current torch. So it installs WITHOUT its transitive dependencies and with
# the four it actually needs at run time listed here. `utils3d_moge` is a different package from
# the `utils3d` on PyPI, which is an unrelated stub; installing that one fails a long way from the
# cause, with `module 'utils3d' has no attribute 'pt'`.
#
# An instance without this extra still ingests a corpus and reports the depth stage as not run,
# which is the same arrangement the vision stage has. A pipeline that could not run without a
# checkpoint is a pipeline that does not run.
[project.optional-dependencies]
reconstruction = [
  "torch>=2.5",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "scipy>=1.11",
  "moge @ git+https://github.com/microsoft/MoGe.git@74fbce054ebed49800de42d0ad0e83495065719a",
  "utils3d_moge @ git+https://github.com/EasternJournalist/utils3d-moge.git@62f09d58509485564e24d5d9f6aac9ee9ebc0c37",
  "huggingface_hub>=0.26",
]

[project.scripts]
# `uv run orimera-ingest ingest ./photos`. Safe to run repeatedly: the second run reports what
# it skipped and issues no model calls.
orimera-ingest = "orimera.ingest.cli:main"
# `uv run orimera-preflight`. Checks every model identifier the manifest can reach against the
# live catalog. Exit 0 clean, 1 on any failure, so CI and the weekly uptime check on a running
# deployment can both call it without parsing output. `--catalog-file` checks a saved snapshot
# instead of the network, which is how the offline test runs it.
orimera-preflight = "orimera.models.preflight:main"
# `uv run orimera-corpus`. Writes the synthetic corpus and the ground truth manifest that goes
# with it. Deterministic from its seed, so a rebuild followed by an ingest recomputes nothing.
orimera-corpus = "orimera.corpus.__main__:main"
# `uv run orimera-identity propose --workspace <uuid>`. Asks the corpus what it recognises, from
# context and never from biometrics. Separate from the ingest command because the moment a
# proposal becomes possible is when somebody is NAMED, and no ingest follows that.
orimera-identity = "orimera.identity.cli:main"

[dependency-groups]
dev = [
  "uvicorn>=0.30",
  # import-linter enforces the layering below. The web workspace has had a dependency-cruiser
  # contract since it was created and the backend had nothing, which meant the layering was a
  # comment. A boundary nobody checks is a boundary that has already been crossed.
  "import-linter>=2.0",
  "pytest>=8.3",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orimera"]

# The reconstruction extra names two packages by git url, because neither is on PyPI in the form
# MoGe needs: MoGe itself is source-only, and `utils3d_moge` is a different package from the
# `utils3d` that is published. Hatchling refuses a direct reference unless it is told to allow
# one, and refusing quietly would have been worse: the alternative is vendoring two repositories.
[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# The ML stack lags Python 3.14 (the system interpreter here), so the interpreter is pinned
# rather than merely lower-bounded. .python-version holds the concrete pin for `uv run`.
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["orimera", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # import sorting
  "UP",        # pyupgrade
  "B",         # bugbear
  "SIM",       # simplify
  "RUF",       # ruff-specific
  "ANN",       # missing type annotations: the project rule is type hints everywhere
]
ignore = [
  "ANN401",    # allow typing.Any where a genuinely open value is intended
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
# Standalone PEP 723 verification harnesses, committed before this package existed and left
# byte-identical so the runtime evidence they produced stays reproducible. Still linted for real
# errors (pyflakes, bugbear); only cosmetic rules are waived.
"scripts/*" = ["ANN", "E501", "E401", "I001"]

[tool.ruff.format]
exclude = ["scripts/*.py"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "postgres: requires a live PostgreSQL 18 server with pgvector via ORIMERA_TEST_DATABASE_URL",
]


# --------------------------------------------------------------------------------------------
# The backend layering, enforced. `uv run lint-imports`.
#
# The rule this encodes: the core is pure and the edges depend on it, never the reverse. The
# evidence address, the object store and the model client know nothing about each other and
# nothing about a database; a change to any one of them cannot reach the other two. Everything
# that talks to PostgreSQL is above them, and the future HTTP layer will sit above that.
# --------------------------------------------------------------------------------------------

[tool.importlinter]
root_package = "orimera"
# Needed by the forbidden contract below: without it, psycopg is invisible to the graph and the
# contract passes for the wrong reason.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The backend is layered, and the core is at the bottom"
type = "layers"
layers = [
  # The HTTP surface depends on everything and nothing depends on it. That is the definition of
  # a thin API: routes validate and delegate, so a route has nothing another module could want.
  "orimera.api",
  # The three top-level workflows, and none of them may import another: ingesting a photograph,
  # answering a question about one, and reading the whole graph back are separate concerns that
  # happen to share a database, and a dependency in any direction would be the first step to the
  # read path reaching for a writer. `orimera.graph` is named here rather than left out for the
  # same reason `orimera.corpus` is named at the bottom: a module absent from every contract is a
  # module the layering says nothing about. It sits one step under the API, which is where an
  # upward import is easiest to write and hardest to notice.
  "orimera.graph | orimera.selection | orimera.ingest",
  "orimera.identity",
  "orimera.epistemics",
  "orimera.db | orimera.models | orimera.store",
  # Reconstruction is driven by ingest and knows nothing about the evidence spine. It is a
  # layer of its own rather than a sibling of the three above because it must sit BELOW them
  # for the forbidden contract on it to mean anything: a module that may import evidence and
  # chooses not to is a habit, and one that may not is a rule.
  "orimera.reconstruction",
  "orimera.evidence | orimera.migrations",
  "orimera.canonical",
  # The corpus generator sits at the bottom and depends on nothing in this package at all: it
  # draws pictures with Pillow and knows nothing about evidence, storage or the database. Listed
  # here rather than left out, because a module absent from every contract is a module the
  # layering says nothing about, and the point of the corpus is to be the input to the pipeline
  # rather than a participant in it.
  "orimera.corpus | orimera.errors",
]

[[tool.importlinter.contracts]]
# The model client is the one part of the core that must know nothing about the rest of it.
# Everything it touches is a request and a response; if it ever learns what an evidence address
# is, the temptation to have it write one follows immediately, and invariant 4 is the rule that
# a model never writes into canonical state.
#
# Note what is deliberately NOT claimed here. `orimera.store` DOES import `orimera.evidence`,
# because a content-addressed store is keyed by a content address and BlobId is that address.
# The layer list above permits exactly that direction and no other.
name = "The model client knows nothing about evidence, storage or the database"
type = "forbidden"
source_modules = ["orimera.models"]
forbidden_modules = [
  "orimera.evidence",
  "orimera.store",
  "orimera.db",
  "orimera.ingest",
  "orimera.migrations",
]

[[tool.importlinter.contracts]]
# INVARIANT 2, as a rule the tooling keeps rather than a sentence in a document.
#
# "Reconstruction is never evidence. No function may return a rendition, a point map, or a
# rendered view as a citation target." The strongest available form of that is a producer that
# cannot construct a citation: `orimera.reconstruction` does not import the module that defines an
# evidence address, so no refactor inside it can produce one, and no reviewer has to notice.
#
# The store and the database are forbidden for the same reason one step further out. A module that
# could write to the object store could register a point map as a blob, and a blob is the one
# thing an `evidence_span` is allowed to point at. The pipeline does the writing, where the rule
# about what may be cited is already enforced by the schema.
name = "Reconstruction cannot produce a citation, because it cannot name one"
type = "forbidden"
source_modules = ["orimera.reconstruction"]
forbidden_modules = [
  "orimera.evidence",
  "orimera.store",
  "orimera.db",
  "orimera.ingest",
  "orimera.identity",
  "orimera.selection",
]

[[tool.importlinter.contracts]]
# The pure core is testable with no server and no credentials, and that is a property worth
# pinning rather than rediscovering. A psycopg import here would mean an evidence address had
# learned how it is stored.
name = "The pure core does not know a database exists"
type = "forbidden"
source_modules = [
  "orimera.canonical",
  "orimera.errors",
  "orimera.evidence",
  "orimera.models",
  "orimera.store",
]
forbidden_modules = ["psycopg"]
